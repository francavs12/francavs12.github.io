<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Fran Cavs — wired node</title>

<style>

body{
background:#050505;
color:#8cff8c;
font-family: "Courier New", monospace;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
overflow:hidden;
}

/* CRT scanlines */

body::before{
content:"";
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:repeating-linear-gradient(
0deg,
rgba(0,0,0,0.4),
rgba(0,0,0,0.4) 2px,
transparent 2px,
transparent 4px
);
pointer-events:none;
}

/* main card */

.card{
border:1px solid #222;
padding:30px;
width:420px;
background:#0a0a0a;
box-shadow:0 0 15px #003300;
}

/* glitch title */

.glitch{
font-size:22px;
position:relative;
}

.glitch::before,
.glitch::after{
content:attr(data-text);
position:absolute;
left:0;
}

.glitch::before{
color:#ff00c8;
animation:glitch1 2s infinite;
}

.glitch::after{
color:#00fff9;
animation:glitch2 2s infinite;
}

@keyframes glitch1{
0%{left:0}
20%{left:2px}
40%{left:-2px}
60%{left:1px}
80%{left:-1px}
100%{left:0}
}

@keyframes glitch2{
0%{left:0}
20%{left:-2px}
40%{left:2px}
60%{left:-1px}
80%{left:1px}
100%{left:0}
}

.section{
margin-top:18px;
}

a{
color:#8cff8c;
text-decoration:none;
}

a:hover{
text-decoration:underline;
}

.clock{
color:#666;
font-size:12px;
margin-top:5px;
}

.cursor{
animation:blink 1s infinite;
}

@keyframes blink{
50%{opacity:0}
}

</style>
</head>

<body>

<div class="card">

<div class="glitch" data-text="FRAN CAVS">
FRAN CAVS
</div>

<div class="clock">
node time: <span id="clock"></span>
</div>

<div class="section">
> status<span class="cursor">_</span><br>
connected to the wired<br>
iyashikei enjoyer<br>
tails enthusiast
</div>

<div class="section">
> currently watching<br>
Lucky Star
</div>

<div class="section">
> currently listening<br>
David Bowie — Starman
</div>

<div class="section">
> favorite works<br>
Aria<br>
Sangatsu no Lion<br>
Natsume Yuujinchou<br>
Yokohama Kaidashi Kikou
</div>

<div class="section">
> links<br>
<a href="#">twitter</a><br>
<a href="#">letterboxd</a><br>
<a href="#">anilist</a>
</div>

</div>

<script>

function updateClock(){
let now = new Date();
let time = now.toLocaleTimeString();
document.getElementById("clock").innerText = time;
}

setInterval(updateClock,1000);
updateClock();

</script>

</body>
</html>
